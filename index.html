<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>PSBees — редактор печатных плат</title>
    <script>
      // Тема до первой отрисовки (избегает вспышки): тёмная по умолчанию.
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('psbees.theme');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) { /* приватный режим и т.п. */ }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--page, #0f1115); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
