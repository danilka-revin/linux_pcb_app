# Сборка Windows-установщика и портативного exe.
# Чтобы GitHub Actions подхватил этот файл, скопируйте его в
#   .github/workflows/windows.yml
# Артефакты: PSBees-Setup-*.exe (NSIS) и PSBees-portable-*.exe.
name: Сборка Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Версия пакета из тега релиза
        if: startsWith(github.ref, 'refs/tags/v1.')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-package-version.mjs $env:RELEASE_TAG

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Сборка exe и установщика
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: psbees-windows
          path: |
            release/PSBees-Setup*.exe
            release/PSBees-portable*.exe
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PSBees-Setup*.exe
            release/PSBees-portable*.exe
          # Релиз и русские заметки уже созданы scripts/make-release.mjs;
          # здесь к нему только добавляются установщик и portable exe.
          generate_release_notes: false
